[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
version = "0.1.0"
description = "Local spec-first agent pipeline prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
  "typing_extensions>=4.12",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "openai-codex>=0.1.0b2",
]

[project.optional-dependencies]
ui = [
  "playwright>=1.44",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "websockets>=12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
