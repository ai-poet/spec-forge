[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
version = "0.1.0"
description = "Local spec-first agent pipeline prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "langgraph>=0.2.52",
  "langgraph-checkpoint-sqlite>=2.0.6",
  "typing_extensions>=4.12",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "websockets>=12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
